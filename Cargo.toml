[package]
name = "skeletal"
version = "0.1.0"
edition = "2024"

[dependencies]
mutual = "1.0.2"
skeletal_shaders = { path = "./shaders" }
anarchy = { path = "../anarchy" }
cell = { path = "../cell" }
gearbox = { path = "../gearbox" }
magician-vgpu = { path = "../shader_magician/magician-vgpu" }

chrono = "0.4.44"
futures = "0.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
gltf = "1.4.1"
base64 = "0.22.1"
ahash = { version = "0.8.12", default-features = false, features = ["std", "compile-time-rng"] }
wgpu = "29.0"
derive_more = "2.1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ufbx = "0.11.2"

[dev-dependencies]
iso_ui = { path = "../iso_ui" }
rfd = "0.17.2"
